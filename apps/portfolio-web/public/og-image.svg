<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5b6cff"/>
      <stop offset="52%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4d9bff"/>
    </linearGradient>
    <radialGradient id="g1" cx="10%" cy="4%" r="60%">
      <stop offset="0%" stop-color="#5b6cff" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#5b6cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="95%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.17"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="72%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#4d9bff" stop-opacity="0.16"/>
      <stop offset="62%" stop-color="#4d9bff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- base -->
  <rect width="1200" height="630" fill="#f4f5f9"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>
  <rect width="1200" height="630" fill="url(#g3)"/>

  <!-- frame -->
  <rect x="48" y="48" width="1104" height="534" rx="18" fill="none" stroke="rgba(26,28,38,0.10)" stroke-width="1.5"/>

  <!-- watermark monogram -->
  <text x="1096" y="470" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="300" fill="#1a1c26" fill-opacity="0.05">ny</text>

  <!-- top label -->
  <text x="92" y="128" font-family="'JetBrains Mono', Consolas, monospace" font-size="24" letter-spacing="3" fill="#4e5ad4">ny — Next Yourself</text>

  <!-- name -->
  <text x="88" y="320" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="128" fill="#1a1c26" letter-spacing="-2">Nayoung Park<tspan font-size="52" fill="#4e5ad4" dy="-58">&#174;</tspan></text>

  <!-- accent underline -->
  <rect x="92" y="356" width="360" height="8" rx="4" fill="url(#accent)"/>

  <!-- roles -->
  <text x="92" y="430" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="38" fill="#565a68">Design System · Frontend · AI Engineer</text>

  <!-- korean name -->
  <text x="94" y="482" font-family="'Malgun Gothic', 'Segoe UI', sans-serif" font-size="27" fill="#8f919e">박나영 · Seoul, Korea</text>

  <!-- bottom manifesto -->
  <text x="92" y="548" font-family="'JetBrains Mono', Consolas, monospace" font-size="22" letter-spacing="1" fill="#8f919e">Next Yourself.  Stay Young.  Keep Challenging.</text>
</svg>
